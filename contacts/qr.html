<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Generator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: system-ui, sans-serif;
    }

    #qrcode {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="qrcode"></div>
  <button id="downloadBtn">Download PNG</button>

  <!-- QRCodeJS -->
  <script src="js/qrcodejs.min.js"></script>

  <script>
    // =========================
    // 1. URL 파라미터 읽기
    // =========================
    const params = new URLSearchParams(window.location.search);

    const TARGET_URL = params.get("u");     // QR에 들어갈 URL
    const NAME = params.get("name") || "qr"; // 파일명용 (옵션)

    if (!TARGET_URL) {
      alert("Missing target URL (?u=...)");
      throw new Error("TARGET_URL is required");
    }

    // =========================
    // 2. QR 생성
    // =========================
    const qrContainer = document.getElementById("qrcode");

    const qr = new QRCode(qrContainer, {
      text: TARGET_URL,
      width: 600,
      height: 600,
      correctLevel: QRCode.CorrectLevel.H
    });

    // =========================
    // 3. PNG 다운로드
    // =========================
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const canvas = qrContainer.querySelector("canvas");

      if (!canvas) {
        alert("QR not ready yet");
        return;
      }

      const pngUrl = canvas.toDataURL("image/png");

      const link = document.createElement("a");
      link.href = pngUrl;
      link.download = `${NAME}-QR-1024px.png`;   // ← 자동 파일명

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>

</body>
</html>
