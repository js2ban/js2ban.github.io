<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jaeseog Ban – QR</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: system-ui, sans-serif;
    }

    #qrcode svg {
      width: 300px;
      height: 300px;
    }

    a.download {
      margin-top: 20px;
      padding: 10px 18px;
      font-size: 14px;
      text-decoration: none;
      color: white;
      background: #0066ff;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div id="qrcode"></div>
  <a id="downloadLink" class="download" style="display:none;">Download SVG</a>

  <script src="js/qrcode.min.js"></script>

  <script>
    const targetUrl = "https://js2ban.github.io/jsban/";

    QRCode.toString(
      targetUrl,
      { type: "svg", errorCorrectionLevel: "H" },
      function (err, svg) {
        if (err) {
          console.error(err);
          return;
        }

        // QR 표시
        document.getElementById("qrcode").innerHTML = svg;

        // 다운로드 링크 생성 (data URL)
        const encoded = encodeURIComponent(svg);
        const downloadLink = document.getElementById("downloadLink");
        downloadLink.href = `data:image/svg+xml;charset=utf-8,${encoded}`;
        downloadLink.download = "jsban-qr.svg";
        downloadLink.style.display = "inline-block";
      }
    );
  </script>

</body>
</html>
