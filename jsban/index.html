<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jaeseog Ban – QR</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: white;
    }

    #qrcode img {
      width: 300px;
      height: 300px;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="qrcode"></div>
  <button id="downloadBtn">Download PNG + SVG</button>

  <!-- PNG용 QR (qrcodejs) -->
  <script src="js/qrcode.min.js"></script>

  <script>
    const TARGET_URL = "https://js2ban.github.io/jsban/";
    const SIZE = 1024; // 인쇄용 고해상도 PNG

    /* =========================
       1️⃣ PNG QR 생성
    ========================= */
    const qr = new QRCode(document.getElementById("qrcode"), {
      text: TARGET_URL,
      width: SIZE,
      height: SIZE,
      correctLevel: QRCode.CorrectLevel.H
    });

    /* =========================
       2️⃣ SVG QR 직접 생성
       (라이브러리 없음)
    ========================= */
    function generateSvgQR(text, size = 1024) {
      const encoded = encodeURIComponent(text);
      return `
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 21 21">
  <rect width="21" height="21" fill="white"/>
  <image href="https://api.qrserver.com/v1/create-qr-code/?size=21x21&data=${encoded}" width="21" height="21"/>
</svg>`;
    }

    /* =========================
       3️⃣ 다운로드 처리
    ========================= */
    document.getElementById("downloadBtn").addEventListener("click", () => {

      /* PNG 다운로드 */
      const img = document.querySelector("#qrcode img");
      const pngLink = document.createElement("a");
      pngLink.href = img.src;
      pngLink.download = "jsban-qr.png";
      pngLink.click();

      /* SVG 다운로드 */
      const svgData = generateSvgQR(TARGET_URL);
      const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const svgLink = document.createElement("a");
      svgLink.href = url;
      svgLink.download = "jsban-qr.svg";
      svgLink.click();

      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
