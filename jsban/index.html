<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jaeseog Ban – QR</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: white;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="qrcode"></div>
  <button id="downloadBtn">Download PNG</button>

  <!-- ✅ 브라우저 전용 QRCode -->
  <script src="js/qrcodejs.min.js"></script>

  <script>
    const targetUrl = "https://js2ban.github.io/jsban/";

    // QR 생성 (Canvas)
    const qr = new QRCode(document.getElementById("qrcode"), {
      text: targetUrl,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.H
    });

    // 다운로드
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const canvas = document.querySelector("#qrcode canvas");
      if (!canvas) {
        alert("QR not ready");
        return;
      }

      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "jsban-qr.png";
      link.click();
    });
  </script>

</body>
</html>
