<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jaeseog Ban – QR</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }
    #qrcode {
      width: 280px;
      height: 280px;
    }
  </style>
</head>

<body>

  <div id="qrcode"></div>

  <!-- QRCode.js (browser-safe) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://js2ban.github.io/jsban/",
      width: 280,
      height: 280,
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
