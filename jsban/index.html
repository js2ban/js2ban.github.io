<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSBAN Digital Card</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 { margin: 0; }
    p { margin: 6px 0; color: #555; }
    a.btn {
      display: block;
      margin-top: 18px;
      padding: 14px;
      background: #007aff;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jaeseog Ban</h1>
    <p>ABC Company</p>
    <p>Senior Engineer</p>
    <p>📞 010-XXXX-XXXX</p>
    <p>✉️ you@example.com</p>

    <a class="btn" href="contact.vcf">연락처에 추가</a>
  </div>
</body>
</html>
